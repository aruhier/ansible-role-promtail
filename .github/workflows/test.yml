---
name: Test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: yamllint
        run: uvx yamllint .
      - name: ansible-lint
        run: uvx --from ansible-lint --with ansible-core ansible-lint
