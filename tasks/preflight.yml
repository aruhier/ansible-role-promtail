---
- name: Get checksum list
  ansible.builtin.set_fact:
    __promtail_checksums: "{{ lookup('ansible.builtin.url', 'https://github.com/grafana/loki/releases/download/v' + promtail_version + '/SHA256SUMS', wantlist=True) | list }}"
  run_once: true
  delegate_to: localhost
  when: not promtail_custom_checksum

- name: Get checksum for architecture {{ go_arch }}
  ansible.builtin.set_fact:
    __promtail_checksum: "{{ item.split(' ')[0] }}"
  loop: "{{ __promtail_checksums }}"
  when:
    - not promtail_custom_checksum
    - ('promtail-linux-' + go_arch + '.zip') in item

- name: Ensure a promtail binary is published for this version and architecture
  ansible.builtin.assert:
    that: promtail_custom_checksum or __promtail_checksum is defined
    fail_msg: >-
      No promtail-linux-{{ go_arch }}.zip found in Loki v{{ promtail_version }} release.
      Promtail is EOL upstream and is not published after Loki 3.6.11.
    quiet: true
